name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
      BIOMETRIC_SERVICE_URL: http://127.0.0.1:8001
      BIOMETRIC_SERVICE_TOKEN: ci-biometric-token-with-at-least-32-characters
      BIOMETRIC_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CRON_SECRET: ci-cron-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run audit:prod
      - run: npm run build

  biometric-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            biometric_service/requirements.txt
            biometric_service/requirements-test.txt
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install -r biometric_service/requirements-test.txt
      - run: python -m unittest discover -s biometric_service/tests -v
        env:
          SAFE_EPI_BIOMETRIC_SERVICE_TOKEN: ci-biometric-token-with-at-least-32-characters
      - run: python -m pip_audit -r biometric_service/requirements.txt

  windows-fingerprint-agent:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
        working-directory: windows_biometric_agent
