name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-placeholder
      BIOMETRIC_SERVICE_URL: http://127.0.0.1:8001
      BIOMETRIC_SERVICE_TOKEN: ci-biometric-token-with-at-least-32-characters
      BIOMETRIC_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CRON_SECRET: ci-cron-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run audit:prod
      - run: npm run build

  biometric-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: biometric_service/requirements.txt
      - run: python -m pip install --upgrade pip pip-audit pydantic-settings
      - run: python -m unittest discover -s biometric_service/tests -v
        env:
          SAFE_EPI_BIOMETRIC_SERVICE_TOKEN: ci-biometric-token-with-at-least-32-characters
      - run: python -m pip_audit -r biometric_service/requirements.txt
